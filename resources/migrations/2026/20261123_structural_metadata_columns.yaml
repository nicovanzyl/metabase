## Tables and Fields record how a table is built: its role, its history (slowly changing dimension) and custom
## property bindings, and which fields make up its grain. Sync, admins and dbt write these values; nothing reads them
## yet. Every column is nullable with no default and no backfill, so an existing instance sees NULL everywhere.
##
## metabase_table_user_settings and metabase_field_user_settings carry the same columns to record what a user set.
## history_definition, eav_definition and period_granularity are nullable and also written by sync, so their `_set`
## flags record that a user set them to NULL on purpose and sync must leave them alone.

databaseChangeLog:
  - changeSet:
      id: as9qdr
      author: metatyb
      comment: Add table_role to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: table_role
                  type: varchar(64)
                  remarks: "How the table is built, as a role/* keyword: a fact, a dimension, a bridge, ..."

  - changeSet:
      id: dhsos8
      author: metatyb
      comment: Add scd_type to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: scd_type
                  type: smallint
                  remarks: "The slowly changing dimension type of a history table, 0 to 7"

  - changeSet:
      id: 15pj5l
      author: metatyb
      comment: Add history_definition to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: history_definition
                  type: ${text.type}
                  remarks: "JSON: which fields of a history table hold its durable key, validity interval and current-row flag"

  - changeSet:
      id: x3y3g7
      author: metatyb
      comment: Add eav_definition to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: eav_definition
                  type: ${text.type}
                  remarks: "JSON: which fields of a custom property table hold the entity key, property name and value"

  - changeSet:
      id: bl4b9c
      author: metatyb
      comment: Add period_granularity to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: period_granularity
                  type: varchar(16)
                  remarks: "The spacing of a periodic snapshot table's period, e.g. day or month"

  - changeSet:
      id: ulxp0c
      author: metatyb
      comment: Add grain_description to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: grain_description
                  type: ${text.type}
                  remarks: "What one row of the table is, in words"

  - changeSet:
      id: xcb3u4
      author: metatyb
      comment: Add is_grain to metabase_field
      changes:
        - addColumn:
            tableName: metabase_field
            columns:
              - column:
                  name: is_grain
                  type: ${boolean.type}
                  remarks: "Whether the field is part of the set of fields that identifies a row of its table"

  - changeSet:
      id: lpg4o0
      author: metatyb
      comment: Add attribute_scd_type to metabase_field
      changes:
        - addColumn:
            tableName: metabase_field
            columns:
              - column:
                  name: attribute_scd_type
                  type: smallint
                  remarks: "How changes to the field are kept on a history table, as a slowly changing dimension type"

  - changeSet:
      id: rdy3wc
      author: metatyb
      comment: Add table_role to metabase_table_user_settings
      changes:
