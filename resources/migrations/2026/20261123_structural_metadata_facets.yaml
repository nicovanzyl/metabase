## The facets of a field: the roles it plays besides its semantic type (a time role, a key role, a structure role, a
## lifecycle role), as a JSON array of type/* keywords. Kept apart from the other structural metadata columns because
## the storage is still open: the source spec has a map with one key per facet kind, each with its own user override.

databaseChangeLog:
  - changeSet:
      id: 0hsxh4
      author: metatyb
      comment: Add facets to metabase_field
      changes:
        - addColumn:
            tableName: metabase_field
            columns:
              - column:
                  name: facets
                  type: ${text.type}
                  remarks: "JSON array of type/* keywords: the roles the field plays besides its semantic type"

  - changeSet:
      id: hebsk5
      author: metatyb
      comment: Add facets to metabase_field_user_settings
      changes:
        - addColumn:
            tableName: metabase_field_user_settings
            columns:
              - column:
                  name: facets
                  type: ${text.type}
                  remarks: "User-set facets for the Field"
